t:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:99px}.list{display:grid}.row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #28354a}.row:last-child{border-bottom:0}.check{appearance:none;width:17px;height:17px;border-radius:5px;border:1px solid #62728a;background:#0b1320;flex:0 0 17px;margin:1px 0 0;display:grid;place-items:center}.check:checked{background:var(--cyan);border-color:var(--cyan)}.check:checked:after{content:'✓';font-size:11px;color:#07191b;font-weight:900}.rowmain{flex:1;min-width:0}.rowtitle{font-size:11px;font-weight:700}.rowtitle.done{text-decoration:line-through;color:#73839c}.rowsub{font-size:9px;color:var(--muted);margin-top:3px}.domain-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.domain{padding:15px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(150deg,#142135,#0f1827);min-height:140px}.symbol{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#203342;color:var(--cyan);font-size:15px;margin-bottom:12px}.domain h4{font-size:13px;margin:0}.domain p{font-size:10px;color:var(--muted);margin:5px 0 10px}.projectgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.project{border:1px solid var(--line);border-radius:15px;padding:15px;background:linear-gradient(150deg,#141f31,#0e1725);display:flex;flex-direction:column;min-height:170px}.project h3{font-size:14px;margin:13px 0 5px}.project p{font-size:10px;line-height:1.5;color:var(--muted);margin:0 0 12px}.projectfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}.label{font-size:10px;color:#aebbd0;font-weight:700;display:block;margin-bottom:5px}.field{width:100%;background:#0a121f;border:1px solid #34445b;border-radius:9px;color:var(--txt);padding:10px;font:inherit;font-size:12px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.taskform{display:grid;gap:10px}.line{height:1px;backgrou (()=>{'use strict';const KEY='ss-lmos-os-v1';const today=()=>new Date().toISOString().slice(0,10);const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);const weekStart=()=>{let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)};const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const initial={page:'home',mission:'Stabilise my personal base while shipping one meaningful piece of the mission.',week:weekStart(),outcomes:['Establish a clear, usable personal operating workspace','Organise one sample of the media archive','Move one LMOS / Zero build forward'],tasks:[['Protect first-job responsibilities with one focused learning block','First Job','Major outcome','Mon'],['Call the laptop contact in Jamshedpur','Operations','Major outcome','Tue'],['Review current expenses and money owed','Financial','Major outcome','Tue'],['Test a room-lighting idea with the phone torch before buying','Freemium','Major outcome','Wed'],['Unpack one defined zone from the move','Physical','Maintenance','Thu'],['Wash a manageable batch of clothes or clean shoes','Physical','Maintenance','Fri'],['Organise the first 25 files from one hard disk','Freemium','Major outcome','Sat'],['Contact one important family member or teacher','Mental','Maintenance','Sun'],['Build or improve one small LMOS / Zero website feature','Zero','Primary mission','Thu']].map(x=>({id:uid(),title:x[0],domain:x[1],priority:x[2],day:x[3],done:false,note:''})),concerns:[{id:uid(),domain:'Mental',title:'Sleep cycle and attention need structure',next:'Log current sleep and wake time for three days.',measure:'Sleep/wake log'},{id:uid(),domain:'Physical',title:'Consistent food, water and movement',next:'Set a realistic daily baseline and track honestly.',measure:'Meals, water and movement recorded'},{id:uid(),domain:'Financial',title:'Clarify expenses, repayments and money owed',next:'List amounts, next actions and dates privately.',measure:'Outstanding items reviewed'},{id:uid(),domain:'LMOS',title:'Ideas and information are scattered',next:'Use one inbox and choose one weekly mission.',measure:'Weekly review completed'}],projects:[['SS Personal','Identity','Mental, physical, financial and LMOS wellbeing, relationships and the first job.','Protect the personal foundation.'],['SS Main / Old Profile','Identity','Existing personal profile; last reported baseline was roughly 1.5k followers. Planned following reset needs careful review.','Audit account and choose a sustainable follow policy.'],['SS New','Identity','A separate public-facing Sudhanshu Singh identity for the next chapter.','Define bio, introduction and contact route.'],['SS Connect — Personal','Connections','Reconnect with people already known from childhood, study, work and life.','Start with a small batch of genuine messages.'],['SS Connect — Global','Connections','A separate profile for professional and worldwide connections.','Define audience and outreach message.'],['Time','Media','Artist identity: rap, singing, beatboxing, instruments and music production.','Make one small audio output.'],['Time.LMOS','Media','Music and stories that communicate LMOS concepts and human experience.','Draft one story concept.'],['Moving Time','Media','Travel, places, people and meaningful observations.','Define the first-episode format.'],['Freemium','Business','Media studio: directing, shooting, editing, education films, real-estate work and storytelling.','Build a repeatable production pipeline.'],['Freemium Education','Business','Educational content for fields such as JEE, NEET, MBA, MBBS, UPSC and other subjects.','Storyboard one lesson using recap cycles.'],['Freemium Real Estate','Business','Real-estate films, property promotion and client ads.','Create a sample property-film treatment.'],['Zero','Build','Structured knowledge, application, coding, building and idea-to-execution roadmaps.','Map one idea from start to test.'],['LMOS','Core system','Personal operating system for internal/external grievances, action, measurement, reflection and life coordination.','Use the weekly mission and review loop.'],['Infinity','Opportunity','Advanced learning, jobs, business, connections, partnerships, pitching and opportunity access.','Record and pursue one useful opportunity.'],['VIP','Services','Premium, high-trust coordination for specialist services and complex client requests.','Define safe and lawful service boundaries.'],['Anything','Marketplace','Future marketplace connecting people’s time and skills to defined tasks.','Explore one narrow use case and safeguards.'],['FC Time','Media','FC Mobile as a lens on football, sponsors, brands, sport, money and media.','Outline one clip with a systems insight.'],['The LMOS Dawg','Media','The LMOS dog’s stories and existing photos/videos.','Find and index the strongest footage.'],['Nirbhaya','Impact','Future initiative starting with animal welfare, with a broader vision for safety, dignity and support.','Define mission and safeguarding principles.'],['One Arm Men','Impact','Support and empowerment inspired by adapting to life with one hand/arm.','Document user needs and one safe pilot.'],['ECR — Empire Control Room','Operations','Freemium master notebook for vision, ideas, scripts, projects, footage and production status.','Create a searchable project/asset index.'],['First Job / J1','Life','Protect current role, learn professionally and plan future independence responsibly.','Select one useful work skill.'],['Doctor LMOS','Core system','Proposed guidance identity for navigating life concerns toward knowledge and suitable next steps. Not a medical substitute.','Define safe, non-diagnostic boundaries.'],['Time.travel','Media','Possible Time branch for movement through places and experiences.','Clarify its distinction from Moving Time.'],['Personal Website / Home Base','Build','One website introducing Sudhanshu and connecting the project ecosystem.','Publish and refine the first version.']].map(x=>({id:uid(),name:x[0],category:x[1],description:x[2],next:x[3],status:['SS Personal','SS Main / Old Profile','SS Connect — Personal','Time','Time.LMOS','Freemium','Zero','LMOS','ECR — Empire Control Room','First Job / J1','Personal Website / Home Base'].includes(x[0])?'active':'planned'})),assets:[],ideas:[{id:uid(),title:'Personal Operating System for one human',problem:'Life, projects, routines, media, money and opportunities are scattered.',domain:'LMOS',step:'Use this dashboard for a full weekly cycle.',connections:'Future LMOS users and builders',status:'building'},{id:uid(),title:'Freemium high-retention educational films',problem:'Educational videos can present information without enough recall and recap.',domain:'Freemium',step:'Storyboard one short lesson with new information and recapitulation.',connections:'Educators and learners',status:'queued'}],opportunities:[],contacts:[],saved:[],logs:[]};let s;try{s=Object.assign(structuredClone(initial),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){s=initial}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={home:'Command centre',week:'Week mission',life:'Life OS',ecosystem:'Ecosystem',studio:'Freemium studio',zero:'Zero lab',infinity:'Infinity',ops:'Ops & Connect'};function save(){localStorage.setItem(KEY,JSON.stringify(s))}function msg(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function done(){return s.tasks.filter(t=>t.done).length}function percent(){return s.tasks.length?Math.round(done()/s.tasks.length*100):0}function section(t,d='',act=''){return `<div class="section"><div><h3>${t}</h3>${d?`<p>${d}</p>`:''}</div>${act}</div>`}function head(k,t,d,act=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div><div style="display:flex;gap:7px;flex-wrap:wrap">${act}</div></div>`}function tag(t,c=''){return `<span class="tag ${c}">${esc(t)}</span>`}function taskrow(t){return `<div class="row"><input type="checkbox" class="check" data-check="${t.id}" ${t.done?'checked':''}><div class="rowmain"><div class="rowtitle ${t.done?'done':''}">${esc(t.title)}</div><div class="rowsub">${esc(t.domain)} · ${esc(t.day)} · ${esc(t.priority)}</div>${t.note?`<div class="rowsub">${esc(t.note)}</div>`:''}</div><button class="link" data-edit-task="${t.id}">Edit</button></div>`}function kpi(t,n,d){return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><span class="cardtitle">${t}</span>${tag('TRACKED','c')}</div><div class="metric">${n}</div><div class="muted">${d}</div></div>`}function domain(sym,title,txt){return `<div class="domain"><div class="symbol">${sym}</div><h4>${title}</h4><p>${txt}</p><button class="link" data-openlife="${title}">Open domain →</button></div>`}function taskForm(t={}){modal('Edit action',`<form id="f" class="taskform"><div><label class="label">Action</label><input class="field" name="title" required value="${esc(t.title||'')}"></div><div class="formrow"><div><label class="label">Domain</label><select class="field" name="domain">${['Mental','Physical','Financial','LMOS','First Job','Operations','SS Connect','Time','Freemium','Zero','Infinity','VIP','Anything'].map(v=>`<option ${v===(t.domain||'LMOS')?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="label">Priority</label><select name="priority" class="field">${['Primary mission','Major outcome','Maintenance','Backlog'].map(v=>`<option ${v===(t.priority||'Maintenance')?'selected':''}>${v}</option>`).join('')}</select></div></div><div><label class="label">Planned day</label><select class="field" name="day">${['Any day',...days].map(v=>`<option ${v===(t.day||'Any day')?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="label">Next step / proof</label><textarea name="note" class="field" rows="3">${esc(t.note||'')}</textarea></div><button class="btn primary" type="submit">Save action</button></form>`);$('f').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(t.id)Object.assign(t,d);else s.tasks.unshift({id:uid(),...d,done:false});save();$('modal').close();render();msg('Action saved')}}function modal(title,html){$('modaltitle').textContent=title;$('modalbody').innerHTML=html;$('modal').showModal()}function render(){ $('date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});$('crumb').textContent=labels[s.page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===s.page));const v=$('view');const f={home:home,week:week,life:life,ecosystem:ecosystem,studio:studio,zero:zero,infinity:infinity,ops:ops}[s.page]||home;v.innerHTML=f()}function home(){return `${head('FOUNDER WORKSPACE / 01','One life. Many missions.<br><span style="color:var(--cyan)">One operating system.</span>','A calm command centre for your life, work, media, products, relationships and opportunities.',`<button class="btn primary" data-page="week">Open this week →</button><button class="btn" data-addtask>+ Add action</button>`)}<div class="hero"><div class="herogrid"><div><div class="eyebrow">THE S/S OPERATING SYSTEM</div><h2>Build the life.<br><em>Build the system.</em></h2><p>Sudhanshu Singh · Time · Founder · Builder · Director · Rapper. Keep attention on the present day while the weekly mission connects each branch to the larger vision.</p><button class="btn primary" data-page="week">Enter weekly mission</button> <button class="btn ghost" data-page="ecosystem">Explore ecosystem</button></div><div class="orb"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core">LMOS</div><span class="orbtag ot1">TIME</span><span class="orbtag ot2">INFINITY</span><span class="orbtag ot3">FREEMIUM</span><span class="orbtag ot4">ZERO</span></div></div></div><div class="grid kpis">${kpi('Actions completed',done(),`${s.tasks.length-done()} still open`)}${kpi('Mapped branches',s.projects.length,'Identities, projects and initiatives')}${kpi('Zero idea maps',s.ideas.length,'Ideas with next actions')}${kpi('Media assets indexed',s.assets.length,'Records added to the archive')}</div><div class="grid two"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px">${tag('WEEK MISSION','g')}${tag('DIRECTION → EXECUTION','c')}</div><div class="mission">${esc(s.mission)}</div><div class="muted">Three major outcomes</div><ol style="font-size:11px;color:#c7d4e7;padding-left:20px;line-height:1.9">${s.outcomes.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="muted">Action completion · ${percent()}%</div><div class="progress"><span style="width:${percent()}%"></span></div><div style="margin-top:13px"><button class="btn" data-editmission>Edit weekly mission</button></div></div><div class="card"><div class="cardtitle">Do the next right thing</div><p class="desc">The map can be huge; the next action should be small enough to start now.</p><div class="list">${s.tasks.filter(t=>!t.done).slice(0,4).map(taskrow).join('')||'<div class="empty">All listed actions completed. Capture the next one.</div>'}</div></div></div>${section('Four life domains + the operating layer','LMOS supports the life it manages.')}<div class="domain-grid">${domain('◌','Mental','Attention, learning, emotional wellbeing and relationships.')}${domain('✦','Physical','Sleep, food, water, movement, recovery and care.')}${domain('₹','Financial','Money clarity, budget, repayments and income pathways.')}${domain('⌘','LMOS','Planning, goals, measurement, review and reflection.')}</div>${section('The connected ecosystem','Branches retain distinct identities while sharing one home base.',`<button class="link" data-page="ecosystem">View all branches →</button>`)}<div class="grid three"><div class="card"><div class="cardtitle">TIME · AUDIO</div><p class="desc">Rap, singing, beatboxing, instruments, music production and storytelling.</p></div><div class="card"><div class="cardtitle">FREEMIUM · VISUAL</div><p class="desc">Direction, shooting, editing, education, real-estate and film production.</p></div><div class="card"><div class="cardtitle">ZERO → INFINITY</div><p class="desc">Structured knowledge, application, code, prototypes, connections and opportunities.</p></div></div><div class="note" style="margin-top:14px"><b>Operating rule:</b> The week provides direction. The day provides execution. The current moment is where the next action happens.</div><p class="footer">V0.1 · Local browser storage · Back up before changing device or clearing site data.</p>`}function week(){return `${head('EXECUTION / 02','The week is the mission.','Year sets direction. Quarter is a campaign. Week is the strategic unit. Day is execution.',`<button class="btn primary" data-addtask>+ Add action</button><button class="btn" data-editmission>Set mission</button>`)}<div class="card"><div class="eyebrow">WEEKLY MISSION</div><div class="mission">${esc(s.mission)}</div><div class="muted">${done()} / ${s.tasks.length} actions complete · ${percent()}%</div><div class="progress"><span style="width:${percent()}%"></span></div><div class="line"></div><div class="cardtitle">Three major outcomes</div><ol style="font-size:11px;line-height:1.9">${s.outcomes.map(o=>`<li>${esc(o)}</li>`).join('')}</ol></div><div class="grid two" style="margin-top:13px"><div class="card"><div class="cardtitle">Open actions</div><div class="list">${s.tasks.filter(t=>!t.done).map(taskrow).join('')||'<div class="empty">Nothing open.</div>'}</div></div><div class="card"><div class="cardtitle">Completed actions</div><div class="list">${s.tasks.filter(t=>t.done).map(taskrow).join('')||'<div class="empty">Completed actions appear here.</div>'}<button class="btn" style="margin-top:12px" data-reflection>Write weekly reflection</button></div></div></div>${section('Daily rhythm','Move tasks around to reflect the real week.')}<div class="grid three">${days.map(d=>`<div class="card"><div class="cardtitle">${d}</div><p class="desc">${s.tasks.filter(t=>t.day===d&&!t.done).map(t=>esc(t.title)).join('<br><br>')||'Recovery, review or a small next step.'}</p></div>`).join('')}</div>${section('The 52-week map','The squares represent calendar weeks, not proof of completed missions.')}<div class="card"><div class="weekmap">${Array.from({length:52},(_,i)=>`<div class="wk ${i===Math.floor((Date.now()-new Date(new Date().getFullYear(),0,1))/604800000)?'cur':i<Math.floor((Date.now()-new Date(new Date().getFullYear(),0,1))/604800000)?'past':''}">W${i+1}</div>`).join('')}</div></div>`}function life(){return `${head('PERSONAL FOUNDATION / 03','Life OS','Log a concern, define a helpful next step and track what changes. This is a self-management aid, not a medical, psychological or financial diagnosis.',`<button class="btn primary" data-addconcern>+ Add concern</button>`)}<div class="note"><b>Core principle:</b> Knowledge → Structure → Action → Measurement → Reflection → Growth. Zero gives structured knowledge; LMOS organizes action and review; Infinity opens deeper growth.</div><div class="domain-grid" style="margin-top:13px">${domain('◌','Mental','Focus, sleep routines, learning and supportive relationships.')}${domain('✦','Physical','Meals, hydration, movement, recovery and environment.')}${domain('₹','Financial','Expenses, repayments, budget and income planning.')}${domain('⌘','LMOS','Time, goals, systems, evidence and weekly reflection.')}</div>${section('Current internal concerns','Each concern should have a next step and an observable measure.',`<button class="link" data-addconcern>+ Add</button>`)}<div class="grid two"><div class="card">${s.concerns.map(c=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(c.title)}</div>${tag(c.domain,c.domain==='Financial'?'g':c.domain==='Mental'?'v':'c')}<div class="rowsub"><b>Next:</b> ${esc(c.next)}</div><div class="rowsub"><b>Measure:</b> ${esc(c.measure)}</div></div><button class="link" data-editconcern="${c.id}">Edit</button></div>`).join('')}</div><div class="card"><div class="cardtitle">Daily baseline</div><p class="desc">Track honestly and consistently; don't treat missed data as a failure.</p>${['Sleep / wake time','Meals / breakfast','Water intake','Movement / recovery','One meaningful connection','One focused work block','End-of-day reflection'].map(it=>`<div class="row"><input class="check" type="checkbox" data-baseline="${esc(it)}" ${s.logs.some(l=>l.date===today()&&l.item===it&&l.done)?'checked':''}><div class="rowmain"><div class="rowtitle">${esc(it)}</div><div class="rowsub">Today only · ${today()}</div></div></div>`).join('')}<p class="desc">Targets like water intake should be personal and adjusted to health, climate and professional advice.</p><button class="btn" data-reflection>Write reflection</button></div></div>`}function projectCard(p){return `<article class="project"><div style="display:flex;justify-content:space-between;gap:8px">${tag(p.category)}${tag(p.status,p.status==='active'?'c':'')}</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="projectfoot"><span class="muted">${esc(p.next)}</span><button class="link" data-editproject="${p.id}">Edit</button></div></article>`}function ecosystem(){return `${head('MAP / 04','One person. Many branches.','The system separates identities, companies, media channels, learning, opportunities and impact initiatives. Status indicates focus, not importance.',`<button class="btn primary" data-addproject>+ Add branch</button>`)}<div class="note"><b>Architecture:</b> Identity ≠ project ≠ channel ≠ department. One personal home base can connect all branches without forcing them into one feed.</div><div class="grid three" style="margin-top:13px"><div class="card"><div class="cardtitle">BUILD</div><p class="desc">Zero · LMOS · code · products · websites · operating systems.</p></div><div class="card"><div class="cardtitle">DISTRIBUTE</div><p class="desc">Freemium · Time · films · songs · social channels · education and real estate.</p></div><div class="card"><div class="cardtitle">CONNECT</div><p class="desc">Infinity · SS Connect · jobs · partnerships · pitching · VIP and Anything.</p></div></div>${section('Project map','Edit each branch’s description, status and next action.') }<div class="projectgrid">${s.projects.map(projectCard).join('')}</div>`}function studio(){return `${head('MEDIA OPERATIONS / 05','Freemium Studio','ECR is the Empire Control Room: catalogue footage, record what is in it, add AI prompts, direct a story and track each asset to publication.',`<button class="btn primary" data-addasset>+ Index asset</button><button class="btn" data-addsaved>+ Saved link</button>`)}<div class="grid two"><div class="card"><div class="cardtitle">The 3 TB archive mission</div><p class="desc">Organise, rename and describe footage from three disks. Pilot the workflow on 10–25 files before processing an entire drive.</p><div class="grid three" style="margin-top:13px"><div class="card"><div class="metric">3</div><div class="muted">Hard disks</div></div><div class="card"><div class="metric">${s.assets.length}</div><div class="muted">Indexed assets</div></div><div class="card"><div class="metric">${s.assets.filter(a=>a.prompt).length}</div><div class="muted">Prompt ready</div></div></div><div class="note" style="margin-top:13px"><b>Safe workflow:</b> backup → inventory → naming convention → description → AI prompt → review → rename/move. Keep originals until the new structure is verified.</div></div><div class="card"><div class="cardtitle">Five output lanes</div><div class="list"><div class="row"><div class="rowmain"><div class="rowtitle">A · Images & posters</div><div class="rowsub">Branding, campaign assets, thumbnails and explainers.</div></div></div><div class="row"><div class="rowmain"><div class="rowtitle">B · Video & film</div><div class="rowsub">Shorts, education, real estate, ads, documentaries and movies.</div></div></div><div class="row"><div class="rowmain"><div class="rowtitle">C · Music & audio</div><div class="rowsub">Rap, songs, instruments, sound design and Time storytelling.</div></div></div><div class="row"><div class="rowmain"><div class="rowtitle">D · Website / E · Social pages</div><div class="rowsub">One home base plus distinct public channels and contact routes.</div></div></div><div class="row"><div class="rowmain"><div class="rowtitle">Future physical creator studio</div><div class="rowsub">Flexible lights, tables and recording space for creators short on time.</div></div></div></div></div></div>${section('Asset register','These records help you locate and direct files; the website does not scan your hard drives automatically.',`<button class="link" data-addasset>+ Add asset</button>`)}<div class="card">${s.assets.length?`<div style="overflow:auto"><table class="table"><tr><th>Asset</th><th>Project</th><th>Drive</th><th>Stage</th><th>Next action</th></tr>${s.assets.map(a=>`<tr><td>${esc(a.title)}<div class="rowsub">${esc(a.description||'No description')}</div></td><td>${esc(a.project)}</td><td>${esc(a.drive)}</td><td><select class="status" data-stage="${a.id}">${['Inbox','Describe','Prompt','Plan','Shoot','Edit','Review','Published'].map(x=>`<option ${x===a.stage?'selected':''}>${x}</option>`).join('')}</select></td><td>${esc(a.next)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No assets indexed yet. Start with a small pilot batch.</div>'}</div>${section('Saved inspiration','Saved items become valuable when attached to a reason and a next action.',`<button class="link" data-addsaved>+ Capture</button>`)}<div class="card">${s.saved.length?s.saved.map(b=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(b.title)}</div><div class="rowsub">${esc(b.source)} · ${esc(b.next)}</div>${b.url?`<a href="${esc(b.url)}" target="_blank" rel="noopener" style="font-size:10px;color:var(--cyan)">${esc(b.url)}</a>`:''}</div></div>`).join(''):'<div class="empty">Capture one useful link or note. Process saved content in batches.</div>'}</div>`}function zero(){return `${head('KNOWLEDGE / APPLICATION / 06','Zero Lab','Zero is a structured path from S (start), through breadth-first knowledge, application and connections, to E (foundational end)—the gateway to Infinity.',`<button class="btn primary" data-addidea>+ Map an idea</button>`)}<div class="hero"><div class="herogrid"><div><div class="eyebrow">S → E → ∞</div><h2 style="font-size:39px">Start at zero.<br><em>Build the path.</em></h2><p>Map the field before specializing; turn understanding into a real application; connect to the people and opportunities that help the journey continue.</p></div><div class="orb"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core" style="background:radial-gradient(circle at 30% 20%,#ead8ff,#795aba 45%,#201733);border-color:#e4d4ff">ZERO</div><span class="orbtag ot1">KNOW</span><span class="orbtag ot2">APPLY</span><span class="orbtag ot3">CONNECT</span></div></div></div><div class="loopgrid"><div class="loop"><span class="smalllabel">LOOP 01</span><h3>Knowledge</h3><p>Map the whole subject first: key concepts, prerequisites, risks and relationships. Then decide where depth matters.</p></div><div class="loop"><span class="smalllabel">LOOP 02</span><h3>Application</h3><p>Turn understanding into a practical action, exercise, prototype or decision. Evidence beats endless consumption.</p></div><div class="loop"><span class="smalllabel">LOOP 03</span><h3>Connections</h3><p>Connect with people, communities, tools, mentors and opportunities. This loop continues toward Infinity.</p></div></div>${section('Zero → Infinity idea library','Each idea contains the problem, a first application, and required connections.',`<button class="link" data-addidea>+ Add idea</button>`)}<div class="projectgrid">${s.ideas.map(i=>`<article class="project">${tag(i.status,'v')}<h3>${esc(i.title)}</h3><p><b>Problem:</b> ${esc(i.problem)}<br><b>First step:</b> ${esc(i.step)}<br><b>Connections:</b> ${esc(i.connections)}</p><div class="projectfoot"><span class="muted">${esc(i.domain)}</span><button class="link" data-editidea="${i.id}">Edit map</button></div></article>`).join('')}</div><div class="card" style="margin-top:13px"><div class="cardtitle">S → E → Infinity</div><div class="pipeline" style="margin-top:13px"><div class="stage"><strong>S · START</strong><div>Define the problem and starting point.</div></div><div class="stage"><strong>BREADTH</strong><div>Map the field before choosing a speciality.</div></div><div class="stage"><strong>DEPTH</strong><div>Learn what the goal actually requires.</div></div><div class="stage"><strong>APPLY</strong><div>Build, test and measure.</div></div><div class="stage"><strong>E · FOUNDATION</strong><div>Become capable of the next independent step.</div></div><div class="stage"><strong>∞ INFINITY</strong><div>Continue mastery, connections and opportunities.</div></div></div></div>`}function infinity(){return `${head('OPPORTUNITY / 07','Infinity','Advanced knowledge plus connections and opportunities: jobs, businesses, partnerships, mentors, investors and collaborators.',`<button class="btn primary" data-addopp>+ Add opportunity</button>`)}<div class="hero"><div class="herogrid"><div><div class="eyebrow">E → ∞</div><h2 style="font-size:40px">Build capability.<br><em>Connect to possibility.</em></h2><p>Infinity is where knowledge and execution meet the wider world: people, markets, work, partnership and growth.</p><button class="btn primary" data-addopp>Capture an opportunity</button></div><div class="orb"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core" style="font-size:23px">∞</div><span class="orbtag ot1">LEARN</span><span class="orbtag ot2">CONNECT</span><span class="orbtag ot3">GROW</span></div></div></div><div class="grid kpis">${kpi('Opportunities',s.opportunities.length,'Saved leads')}${kpi('In outreach',s.opportunities.filter(o=>o.status==='Outreach').length,'Conversation started')}${kpi('Active / meeting',s.opportunities.filter(o=>['Meeting','Active'].includes(o.status)).length,'Next step recorded')}${kpi('Mapped projects',s.projects.length,'Opportunity context')}</div>${section('Opportunity pipeline','Every item needs a next action and an optional follow-up date.',`<button class="link" data-addopp>+ Add</button>`)}<div class="card">${s.opportunities.length?`<div style="overflow:auto"><table class="table"><tr><th>Opportunity</th><th>Type</th><th>Stage</th><th>Next action</th><th>Date</th></tr>${s.opportunities.map(o=>`<tr><td><b>${esc(o.title)}</b><div class="rowsub">${esc(o.who)}</div></td><td>${esc(o.type)}</td><td><select class="status" data-oppstatus="${o.id}">${['Research','Outreach','Meeting','Active','Won','Parked'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${esc(o.next)}</td><td>${esc(o.date||'—')}</td></tr>`).join('')}</table></div>`:'<div class="empty">Add a real job lead, client, business idea, investor conversation, mentor or partnership.</div>'}</div><div class="grid two" style="margin-top:13px"><div class="card"><div class="cardtitle">VIP — high-touch services</div><p class="desc">A future premium service for carefully scoped, lawful and safe specialist needs: understand the request, verify providers, agree cost/scope, coordinate and confirm delivery.</p></div><div class="card"><div class="cardtitle">Anything — human execution marketplace</div><p class="desc">A future marketplace connecting clearly defined tasks with people offering time and skills. It requires identity checks, safety rules, liability, payment and dispute processes before launch.</p></div></div>`}function kpi(t,n,d){return `<div class="card"><div class="cardtitle">${t}</div><div class="metric">${n}</div><div class="muted">${d}</div></div>`}function ops(){return `${head('OPERATIONS / 08','Keep the real world moving.','Your role, move, finances, repairs, studio setup and relationships are part of the mission—not distractions from it.',`<button class="btn primary" data-addcontact>+ Add connection</button><button class="btn" data-addtask>+ Add action</button>`)}<div class="grid two"><div class="card"><div class="cardtitle">Physical setup / maintenance</div><p class="desc">Execute a minimal test before buying where safe and practical.</p>${[['Unpack','One box or one zone from the move.'],['Laundry & shoes','Choose a manageable batch.'],['Chair repair','Inspect parts and record a repair quote.'],['Speaker / music system','Diagnose before replacing parts.'],['Studio setup','Torch test → frame test → budget → purchase.'],['Royal Enfield service','Find a suitable service provider and estimate.'],['Laptop','Verify specification, condition, ownership and price.']].map((a,i)=>`<div class="row"><div class="symbol" style="width:28px;height:28px;flex:0 0 28px;margin:0">${i+1}</div><div class="rowmain"><div class="rowtitle">${a[0]}</div><div class="rowsub">${a[1]}</div></div><button class="link" data-quick="${esc(a[0])}">Add</button></div>`).join('')}</div><div class="card"><div class="cardtitle">First job + financial independence</div><p class="desc">Protect current professional responsibilities while building evidence for future independence. Avoid major transitions without a financial runway and tested alternatives.</p><div class="row"><div class="rowmain"><div class="rowtitle">1 · Protect current income</div><div class="rowsub">Meet role obligations and choose one skill to strengthen.</div></div></div><div class="row"><div class="rowmain"><div class="rowtitle">2 · Get financial clarity</div><div class="rowsub">List expenses, repayments, savings and commitments. Never store bank passwords.</div></div></div><div class="row"><div class="rowmain"><div class="rowtitle">3 · Test alternative income</div><div class="rowsub">Validate one service and speak with one potential customer.</div></div></div><div class="row"><div class="rowmain"><div class="rowtitle">4 · Set a transition threshold</div><div class="rowsub">Define runway and reliable income criteria before a job-exit decision.</div></div></div><button class="btn" data-addtask style="margin-top:12px">Add finance / job action</button></div></div>${section('SS Connect','Personal warm network and global professional connections have different outreach goals.',`<button class="link" data-addcontact>+ Add connection</button>`)}<div class="grid two"><div class="card"><div class="cardtitle">Connection register</div>${s.contacts.length?s.contacts.map(c=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(c.name)}</div><div class="rowsub">${esc(c.group)} · ${esc(c.next)}</div></div></div>`).join(''):'<div class="empty">Add only the details needed for your next genuine conversation. Begin with a small batch, not everyone at once.</div>'}</div><div class="card"><div class="cardtitle">Digital backlog</div><p class="desc">Notes, journal, ChatGPT, Notion, Instagram saves and YouTube Watch Later are inputs—not commitments.</p><div class="row"><div class="rowmain"><div class="rowtitle">Capture</div><div class="rowsub">One inbox for new ideas and useful links.</div></div></div><div class="row"><div class="rowmain"><div class="rowtitle">Classify</div><div class="rowsub">Life, Build, Distribute or Opportunity.</div></div></div><div class="row"><div class="rowmain"><div class="rowtitle">Execute</div><div class="rowsub">Convert selected items into a next action, or archive them.</div></div></div></div></div>`}function editMission(){modal('Set weekly mission',`<form class="taskform" id="mf"><div><label class="label">Master mission</label><textarea class="field" name="mission" rows="3" required>${esc(s.mission)}</textarea></div>${[0,1,2].map(i=>`<div><label class="label">Major outcome ${i+1}</label><input class="field" name="o${i}" value="${esc(s.outcomes[i]||'')}" required></div>`).join('')}<button class="btn primary">Save mission</button></form>`);$('mf').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));s.mission=d.mission;s.outcomes=[d.o0,d.o1,d.o2];save();$('modal').close();render();msg('Weekly mission updated')}}function concernForm(c={}){modal(c.id?'Edit concern':'Add internal concern',`<form id="cf" class="taskform"><div><label class="label">Domain</label><select class="field" name="domain">${['Mental','Physical','Financial','LMOS'].map(x=>`<option ${x===(c.domain||'LMOS')?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Concern</label><input class="field" name="title" required value="${esc(c.title||'')}"></div><div><label class="label">Next step</label><textarea class="field" name="next" required>${esc(c.next||'')}</textarea></div><div><label class="label">How will you notice improvement?</label><input class="field" name="measure" value="${esc(c.measure||'')}"></div><button class="btn primary">Save concern</button></form>`);$('cf').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(c.id)Object.assign(c,d);else s.concerns.unshift({id:uid(),...d});save();$('modal').close();render()}}function ideaForm(i={}){modal(i.id?'Edit idea map':'Create Zero → Infinity idea',`<form id="if" class="taskform"><div><label class="label">Idea / outcome</label><input class="field" name="title" required value="${esc(i.title||'')}"></div><div><label class="label">Domain</label><select class="field" name="domain">${['LMOS','Business','Coding','Media','Finance','Education','Physical','Mental','Community','Other'].map(x=>`<option ${x===(i.domain||'Business')?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Problem</label><textarea class="field" name="problem" required>${esc(i.problem||'')}</textarea></div><div><label class="label">First application</label><textarea class="field" name="step" required>${esc(i.step||'')}</textarea></div><div><label class="label">People / resources / opportunities</label><input class="field" name="connections" value="${esc(i.connections||'')}"></div><button class="btn primary">Save map</button></form>`);$('if').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(i.id)Object.assign(i,d);else s.ideas.unshift({id:uid(),...d,status:'queued'});save();$('modal').close();render()}}function assetForm(){modal('Index media asset',`<form id="af" class="taskform"><div><label class="label">File / asset title</label><input class="field" name="title" required></div><div class="formrow"><div><label class="label">Project</label><select class="field" name="project">${s.projects.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div><div><label class="label">Drive</label><select class="field" name="drive"><option>Drive A</option><option>Drive B</option><option>Drive C</option><option>iPhone</option><option>Cloud</option><option>Other</option></select></div></div><div><label class="label">Original filename / path</label><input class="field" name="path" placeholder="Keep a reference to the original file"></div><div><label class="label">Description</label><textarea class="field" name="description"></textarea></div><div><label class="label">AI prompt / creative possibility</label><textarea class="field" name="prompt"></textarea></div><div><label class="label">Next action</label><input class="field" name="next" value="Describe and tag"></div><button class="btn primary">Save asset record</button></form>`);$('af').onsubmit=e=>{e.preventDefault();s.assets.unshift({id:uid(),...Object.fromEntries(new FormData(e.target)),stage:'Inbox'});save();$('modal').close();render()}}function opportunityForm(){modal('Add opportunity',`<form id="of" class="taskform"><div><label class="label">Opportunity / lead</label><input class="field" name="title" required></div><div><label class="label">Person / organisation</label><input class="field" name="who"></div><div class="formrow"><div><label class="label">Type</label><select class="field" name="type">${['Job','Business','Client','Partnership','Investor','Mentor','Learning','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label class="label">Stage</label><select class="field" name="status">${['Research','Outreach','Meeting','Active','Won','Parked'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div><label class="label">Next action</label><textarea class="field" name="next"></textarea></div><div><label class="label">Follow-up date</label><input class="field" type="date" name="date"></div><button class="btn primary">Save opportunity</button></form>`);$('of').onsubmit=e=>{e.preventDefault();s.opportunities.unshift({id:uid(),...Object.fromEntries(new FormData(e.target))});save();$('modal').close();render()}}function contactForm(){modal('Add connection',`<form id="cf" class="taskform"><div><label class="label">Name</label><input class="field" name="name" required></div><div><label class="label">Group</label><select class="field" name="group"><option>Personal / warm</option><option>Work</option><option>Creator</option><option>Global / professional</option><option>Mentor</option><option>Partner</option><option>Other</option></select></div><div><label class="label">Next conversation / action</label><textarea class="field" name="next"></textarea></div><button class="btn primary">Save connection</button></form>`);$('cf').onsubmit=e=>{e.preventDefault();s.contacts.unshift({id:uid(),...Object.fromEntries(new FormData(e.target))});save();$('modal').close();render()}}function simpleForm(title,fields,callback){modal(title,`<form id="sf" class="taskform">${fields.map(f=>`<div><label class="label">${f[1]}</label><${f[2]||'input'} class="field" name="${f[0]}" ${f[3]?'required':''} ${f[2]==='textarea'?'rows="3"':''}></${f[2]||'input'}></div>`).join('')}<button class="btn primary">Save</button></form>`);$('sf').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)));save();$('modal').close();render();msg('Saved')}}function reflect(){simpleForm('End-of-day reflection',[['win','What moved forward?','textarea',true],['blocked','What blocked progress?','textarea'],['lesson','What did I learn?','textarea'],['next','One next action','input']],d=>{s.logs.push({date:today(),item:'Reflection',done:true,...d});if(d.next)s.tasks.unshift({id:uid(),title:d.next,domain:'LMOS',priority:'Major outcome',day:'Any day',done:false,note:'Created from reflection.'})})}function dispatch(elm){const d=elm.dataset;if(d.page){s.page=d.page;save();render();scrollTo(0,0)}else if(elm.hasAttribute('data-addtask'))taskForm();else if(d.check){let t=s.tasks.find(x=>x.id===d.check);if(t)t.done=elm.checked;save();render();msg(t&&t.done?'Action completed':'Action reopened')}else if(d.editTask){const t=s.tasks.find(x=>x.id===d.editTask);if(t)taskForm(t)}else if(elm.hasAttribute('data-editmission'))editMission();else if(elm.hasAttribute('data-addproject'))simpleForm('Add branch',[['name','Branch / project name','input',true],['category','Category','input',true],['description','What it does','textarea',true],['next','Next step','textarea']],d=>s.projects.unshift({id:uid(),...d,status:'planned'}));else if(d.editproject){const p=s.projects.find(x=>x.id===d.editproject);if(p)simpleForm('Edit '+p.name,[['name','Name','input',true],['category','Category','input',true],['description','Description','textarea',true],['next','Next step','textarea']],d=>Object.assign(p,d))}else if(elm.hasAttribute('data-addconcern'))concernForm();else if(d.editconcern){const c=s.concerns.find(x=>x.id===d.editconcern);if(c)concernForm(c)}else if(d.openlife){s.page='life';save();render()}else if(elm.hasAttribute('data-addidea'))ideaForm();else if(d.editidea){const i=s.ideas.find(x=>x.id===d.editidea);if(i)ideaForm(i)}else if(elm.hasAttribute('data-addasset'))assetForm();else if(elm.hasAttribute('data-addopp'))opportunityForm();else if(elm.hasAttribute('data-addcontact'))contactForm();else if(elm.hasAttribute('data-addsaved'))simpleForm('Capture link / saved item',[['title','Title','input',true],['source','Source','input',true],['url','URL (optional)','input'],['next','Why keep it / next action','textarea']],d=>s.saved.unshift({id:uid(),...d}));else if(elm.hasAttribute('data-reflection'))reflect();else if(d.quick)taskForm({title:d.quick,domain:'Operations',priority:'Maintenance',day:'Any day',note:'Added from the operations checklist.'})}document.addEventListener('click',e=>{const a=e.target.closest('button');if(a)dispatch(a)});document.addEventListener('change',e=>{const a=e.target;if(a.dataset.baseline){let old=s.logs.find(l=>l.date===today()&&l.item===a.dataset.baseline);if(old)old.done=a.checked;else s.logs.push({date:today(),item:a.dataset.baseline,done:a.checked});save()}if(a.dataset.stage){const x=s.assets.find(v=>v.id===a.dataset.stage);if(x)x.stage=a.value;save();msg('Stage updated')}if(a.dataset.oppstatus){const x=s.opportunities.find(v=>v.id===a.dataset.oppstatus);if(x)x.status=a.value;save()}});$('closemodal').onclick=()=>$('modal').close();$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').close()});$('backup').onclick=()=>{const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sudhanshu-lmos-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);msg('Backup prepared')};$('restore').onclick=()=>$('restorefile').click();$('restorefile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.tasks)||!Array.isArray(x.projects))throw Error('invalid');s=Object.assign(structuredClone(initial),x);save();render();msg('Backup restored')}catch(e){msg('Invalid backup file')}e.target.value=''};render();})();
